services:
  # --------------------------------------------------
  # Backend API Service (Node.js / Express)
  # --------------------------------------------------
  - type: web
    name: cityguard-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: USE_SQLITE_FALLBACK
        value: "true"

  # --------------------------------------------------
  # Frontend SPA Service (React / Vite Static Site)
  # --------------------------------------------------
  - type: static
    name: cityguard-frontend
    plan: free
    buildCommand: cd frontend && npm install --legacy-peer-deps && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
