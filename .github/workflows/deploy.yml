name: Deploy CityGuard AI Frontend to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Grant GitHub Actions permissions to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs in progress between queued builds
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Vite application
        run: |
          cd frontend
          npm run build
        env:
          GITHUB_PAGES: 'true'
          NODE_ENV: 'production'

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
